<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語音声認識テスト</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:18px;line-height:1.6}button{font-size:18px;padding:12px;margin:5px}#meter{height:22px;background:#ddd;border-radius:10px;overflow:hidden}#level{height:100%;width:0;background:#25a56a;transition:width .08s}textarea{box-sizing:border-box;width:100%;height:260px;font-size:18px}#status{min-height:2em}</style></head><body><h1>日本語音声認識テスト</h1><p>Windows 10 / 11・Chrome用。日本語 (ja-JP) 固定。患者情報は入力しないでください。音声認識処理が外部サービスに送信される場合があります。</p><button id="start">録音開始</button><button id="stop" disabled>停止</button><button id="copy">全文コピー</button><p id="status">待機中</p><label for="meter">マイク入力レベル</label><div id="meter"><div id="level"></div></div><h2>文字起こし</h2><textarea id="output" aria-label="文字起こし結果"></textarea><script>
const $=id=>document.getElementById(id), SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition,stream,ctx,analyser,raf,committed='',running=false;
function status(s){$('status').textContent=s}async function cleanup(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)await ctx.close();ctx=null;$('level').style.width='0%';$('start').disabled=false;$('stop').disabled=true}
function meter(){if(!analyser)return;const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let s=0;for(const v of a)s+=((v-128)/128)**2;const rms=Math.sqrt(s/a.length);$('level').style.width=Math.min(100,Math.round(rms*350))+'%';raf=requestAnimationFrame(meter)}
$('start').onclick=async()=>{if(!SR){status('このChromeでは音声認識を利用できません');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new AudioContext();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);meter();recognition=new SR();recognition.lang='ja-JP';recognition.continuous=true;recognition.interimResults=true;committed=$('output').value;running=true;recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)committed+=t+'\n';else interim+=t}$('output').value=committed+interim};recognition.onerror=e=>status('認識エラー: '+e.error);recognition.onend=()=>{if(running){try{recognition.start()}catch(e){status('再開できません: '+e.message)}}};recognition.start();$('start').disabled=true;$('stop').disabled=false;status('録音・文字起こし中')}catch(e){status('マイクを開始できません: '+e.message);running=false;await cleanup()}};
$('stop').onclick=async()=>{running=false;if(recognition)recognition.stop();await cleanup();status('停止しました')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);status('コピーしました')}catch(e){status('コピーに失敗しました')}};
</script></body></html>
